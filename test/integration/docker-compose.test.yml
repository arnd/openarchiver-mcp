# Throwaway OpenArchiver stack for the MCP integration test.
# Mirrors the upstream OpenArchiver docker-compose (v0.5.2) but minimised for CI:
# only port 3000 is exposed (the frontend proxies /api/v1 -> backend /v1), the mbox
# fixture is bind-mounted read-only at /fixtures, and all state lives in named volumes
# that the orchestrator drops with `down -v` so every run starts from zero users
# (which lets ADMIN_EMAIL/ADMIN_PASSWORD auto-create the admin via GET /api/v1/auth/status).
#
# The OpenArchiver tag comes from scripts/integration.mjs (see .github/oa-snapshot.json).

services:
    open-archiver:
        # Tag is set by scripts/integration.mjs via the OA_IMAGE_TAG env var.
        image: logiclabshq/open-archiver:${OA_IMAGE_TAG:?OA_IMAGE_TAG is set by scripts/integration.mjs}
        restart: "no"
        ports:
            - '3000:3000'
        env_file:
            - test.env
        volumes:
            - oa-data:/var/data/open-archiver
            - ./fixtures:/fixtures:ro
        # The image runs its DB migration once at startup and exits if Postgres is not yet
        # accepting connections, so wait for it to be healthy, not just started.
        depends_on:
            postgres:
                condition: service_healthy
            valkey:
                condition: service_started
            meilisearch:
                condition: service_started
            tika:
                condition: service_started

    postgres:
        image: postgres:17-alpine
        restart: "no"
        environment:
            POSTGRES_DB: open_archive
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U admin -d open_archive']
            interval: 2s
            timeout: 5s
            retries: 30

    valkey:
        image: valkey/valkey:8-alpine
        restart: "no"
        command: valkey-server --requirepass defaultredispassword

    meilisearch:
        image: getmeili/meilisearch:v1.38
        restart: "no"
        environment:
            MEILI_MASTER_KEY: aSampleMasterKey

    tika:
        image: apache/tika:3.2.2.0-full
        restart: "no"

volumes:
    pgdata:
    oa-data:
