name: Snapshot check

# The Integration matrix pins upstream OpenArchiver images by fixed tag: one dev snapshot
# (commit SHA, non-blocking early warning for breaking changes) and the two newest OSS
# releases (blocking). Fixed tags go stale silently (the snapshot once sat unnoticed for
# ~5 months, through two releases; later the release legs missed v0.6.1/v0.6.2). This job
# watches Docker Hub for newer tags of either kind, runs the integration test against each
# new one, and opens a PR re-pinning them -- with the results in the PR body.
#
# The pins live in .github/oa-snapshot.json, NOT in integration.yml: GitHub rejects every
# GITHUB_TOKEN push that creates or updates a file under .github/workflows/, and there is no
# `workflows` scope to grant in `permissions:` (that exists only for PATs and GitHub Apps).
# Keeping them in a data file is what lets this job push its branch at all.
#
# Values derived from upstream (tag names, commit subjects) are passed to the shell through
# env vars or files, never interpolated into the script with ${{ }}: a commit subject is
# untrusted input and would otherwise be a command injection.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # weekly, Mondays at 04:17 UTC (after the nightly Integration run)

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Look for newer upstream images
        id: check
        run: node scripts/check-snapshot.mjs --write
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Skip if a PR for these pins already exists
        if: steps.check.outputs.changed == 'true'
        id: existing
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state all --json number --jq '.[].number')" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.check.outputs.branch }}

      - run: npm ci
        if: steps.check.outputs.changed == 'true' && steps.existing.outputs.open == 'false'

      # Non-blocking on purpose: a failing tag is the signal worth a PR, not a reason to stay
      # silent. Each newly pinned tag is tested in turn (they share host port 3000, so not in
      # parallel); the outcomes go into the PR body either way.
      - name: Integration test against the new images
        if: steps.check.outputs.changed == 'true' && steps.existing.outputs.open == 'false'
        run: |
          set -uo pipefail
          results="$RUNNER_TEMP/oa-results.md"
          : > "$results"
          for tag in $TAGS; do
            echo "::group::Integration test against $tag"
            if OA_IMAGE_TAG="$tag" npm run test:integration; then
              echo "- \`$tag\`: integration test **passes**" >> "$results"
            else
              echo "- \`$tag\`: integration test **fails** -- see the \"Integration test against the new images\" step in [this run]($RUN_URL). That is the early warning these pins exist for: the wrapper or the test harness likely needs a change before this is merged." >> "$results"
            fi
            echo "::endgroup::"
          done
        env:
          TAGS: ${{ steps.check.outputs.tags }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Open the re-pin PR
        if: steps.check.outputs.changed == 'true' && steps.existing.outputs.open == 'false'
        run: |
          set -euo pipefail
          {
            echo "Upstream published newer OpenArchiver images, so the Integration matrix pins are stale."
            echo
            cat "$RUNNER_TEMP/oa-changes.md"
            echo
            cat "$RUNNER_TEMP/oa-results.md"
            echo
            echo "> Opened by the \`Snapshot check\` workflow. PRs created with \`GITHUB_TOKEN\` do not"
            echo "> trigger other workflows, so the checks below start out empty -- the new tags were"
            echo "> verified in the run linked above instead. Close and reopen the PR to run the full matrix."
          } > "$RUNNER_TEMP/pr-body.md"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -qam "$TITLE"
          git push -q origin "$BRANCH"
          gh pr create --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.check.outputs.branch }}
          TITLE: ${{ steps.check.outputs.title }}
