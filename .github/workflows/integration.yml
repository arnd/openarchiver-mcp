name: Integration

# End-to-end test: spins up a throwaway OpenArchiver stack with docker compose,
# imports an mbox, and drives the built MCP server against the live REST API.
# Runs as a separate workflow (concurrently with the unit CI) on pushes/PRs that
# touch the wrapper, the test harness or this workflow, plus nightly / on demand.
# A run takes ~1 min in CI, so the path filter mainly skips docs/dependabot churn.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # nightly at 03:17 UTC
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'test/integration/**'
      - 'scripts/integration.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration.yml'
      - '.github/oa-snapshot.json'
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  # The versions live in .github/oa-snapshot.json rather than in this file, because a
  # matrix cannot read a file and the `Snapshot check` bot cannot write one: GitHub
  # rejects every GITHUB_TOKEN push that touches .github/workflows/**. This job turns
  # that data file into the matrix. Only OSS semver tags (v0.1.1 … v0.5.2) are freely
  # pullable; v1.x are `-enterprise` only.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pin.outputs.matrix }}
      snapshot: ${{ steps.pin.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: |
          set -euo pipefail
          file=.github/oa-snapshot.json
          {
            echo "matrix=$(jq -c '[.snapshot] + .releases' "$file")"
            echo "snapshot=$(jq -r '.snapshot' "$file")"
          } >> "$GITHUB_OUTPUT"
          jq -r '"Testing against: \(.snapshot) (\(.label), \(.date)) + \(.releases | join(", "))"' "$file"

  integration:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oa_version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: integration (OpenArchiver ${{ matrix.oa_version }})
    # The dev snapshot tracks a moving upstream main and boots in dev mode (it runs
    # `pnpm install` from the network), so it reports without failing the workflow.
    # Released tags stay blocking.
    continue-on-error: ${{ matrix.oa_version == needs.versions.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Integration test (MCP vs. OpenArchiver via docker compose)
        run: npm run test:integration
        env:
          OA_IMAGE_TAG: ${{ matrix.oa_version }}
