name: Integration

# End-to-end test: spins up a throwaway OpenArchiver stack with docker compose,
# imports an mbox, and drives the built MCP server against the live REST API.
# Runs as a separate workflow (concurrently with the unit CI) on pushes/PRs that
# touch the wrapper, the test harness or this workflow, plus nightly / on demand.
# A run takes ~1 min in CI, so the path filter mainly skips docs/dependabot churn.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # nightly at 03:17 UTC
  push:
    branches: [main]
    paths: &paths
      - 'src/**'
      - 'test/integration/**'
      - 'scripts/integration.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration.yml'
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # OpenArchiver versions to test the MCP against. Only OSS semver tags
        # (v0.1.1 … v0.5.2) are freely pullable; v1.x are `-enterprise` only.
        # 2de3d60 = "V0.5.3 dev" snapshot (head of upstream main as of 2026-08-18),
        # an early warning for breaking changes; bump it when a newer snapshot lands.
        oa_version: ['2de3d60', 'v0.5.2', 'v0.4.2']
    name: integration (OpenArchiver ${{ matrix.oa_version }})
    # The dev snapshot tracks a moving upstream main and boots in dev mode (it runs
    # `pnpm install` from the network), so it reports without failing the workflow.
    # Released tags stay blocking.
    continue-on-error: ${{ matrix.oa_version == '2de3d60' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Integration test (MCP vs. OpenArchiver via docker compose)
        run: npm run test:integration
        env:
          OA_IMAGE_TAG: ${{ matrix.oa_version }}
